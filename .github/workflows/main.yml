name: StreamX Media3 Pro - Single Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: streamx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            echo "Android project found directly at repository root."
            exit 0
          fi

          EXISTING_SETTINGS="$(find . -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
          if [[ -n "${EXISTING_SETTINGS}" ]]; then
            PROJECT_DIR="$(dirname "${EXISTING_SETTINGS}")"
            echo "Found extracted project inside subfolder: ${PROJECT_DIR}"
            cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
            test -f settings.gradle.kts
            test -f app/build.gradle.kts
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print | sort | head -n 1)"
          if [[ -z "${ZIP_FILE}" ]]; then
            echo "::error::No source project found. Upload the StreamX source ZIP or extracted project files to the repository."
            exit 1
          fi

          EXTRACT_DIR="${RUNNER_TEMP}/streamx-source"
          mkdir -p "${EXTRACT_DIR}"
          unzip -q "${ZIP_FILE}" -d "${EXTRACT_DIR}"

          SETTINGS_FILE="$(find "${EXTRACT_DIR}" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "${SETTINGS_FILE}" ]]; then
            echo "::error::ZIP does not contain settings.gradle.kts."
            exit 1
          fi
          PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
          test -f "${PROJECT_DIR}/app/build.gradle.kts"
          cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure optional persistent APK signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/streamx-release.jks"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            test -s "${KEYSTORE_PATH}"
            {
              echo "SIGNING_STORE_FILE=${KEYSTORE_PATH}"
              echo "SIGNING_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "SIGNING_KEY_ALIAS=${KEY_ALIAS}"
              echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "${GITHUB_ENV}"
            echo "Persistent release signing key configured."
          else
            echo "::notice::No persistent signing secrets configured; Gradle will use its debug signing key. An APK signed with a different key cannot update an existing installation."
          fi

      - name: Verify project and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_project.py
          gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build one release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease -x lint -x lintVitalRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          mkdir -p single_release_out
          cp "${APK}" single_release_out/StreamX-Media3-Pro-v13.0-Glass-Zap-512MB.apk
          sha256sum single_release_out/StreamX-Media3-Pro-v13.0-Glass-Zap-512MB.apk
          ls -lh single_release_out/

      - name: Upload single release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-v13.0-Glass-Zap-Single-Release
          path: single_release_out/StreamX-Media3-Pro-v13.0-Glass-Zap-512MB.apk
          if-no-files-found: error
          retention-days: 14
